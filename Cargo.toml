[workspace]
members = ["debuggable", "debuggable-derive", "cargo-debuggable", "examples", "tests/harness"]
exclude = ["tests/fixtures"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
rust-version = "1.75.0"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tommantonclery/debuggable"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
# Declares our opt-out flag to rustc >= 1.80 (see schema-v1 §2.1).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(debuggable_disable)"] }
