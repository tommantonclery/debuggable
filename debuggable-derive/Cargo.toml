[package]
name = "debuggable-derive"
description = "Derive macro for the debuggable crate. Use `debuggable` instead."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
proc-macro = true

[dependencies]
# syn 3: the major that serde_derive, thiserror, tokio-macros and clap_derive already use,
# so most dependency graphs compile it anyway (measured in Phase 4, Step 15).
proc-macro2 = "1"
syn = { version = "3", default-features = false, features = ["derive", "parsing", "printing", "proc-macro"] }

[lints]
workspace = true