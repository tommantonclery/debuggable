[package]
name = "debuggable"
description = "Derive macro that makes your types readable in GDB, LLDB and VS Code (CodeLLDB)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
documentation = "https://docs.rs/debuggable"
readme = "../README.md"
keywords = ["debugger", "gdb", "lldb", "derive", "debugging"]
