[package]
name = "cargo-debuggable"
description = "Sets up GDB, LLDB and VS Code (CodeLLDB) for the `debuggable` crate, and checks binaries"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["debugger", "gdb", "lldb", "vscode", "cargo-subcommand"]
categories = ["development-tools::debugging", "development-tools::cargo-plugins", "command-line-utilities"]

[dependencies]
# Reads section tables of ELF and Mach-O binaries for `doctor`. 0.39: 0.40 needs Rust 1.85.
object = { version = "0.39", default-features = false, features = ["read_core", "elf", "macho", "std"] }

[lints]
workspace = true
